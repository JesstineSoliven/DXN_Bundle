<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DXN Bundle Store — Better Health, A Brighter Tomorrow</title>
  <meta name="description" content="Build your own DXN product bundle or get a Mystery Box. Featured DXN Bundle Package at ₱7,999.">
  <link rel="icon" href="assets/img/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Libre+Baskerville:wght@700&family=Montserrat:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#1A552E', // primary buttons, chips, active states
              deep: '#164E2A',    // hover / pressed
              band: '#1F4028',    // footer band
              soft: '#EBF2E6',    // "Create your own bundle" card
              mist: '#E2EBD9',    // featured card footer strip
            },
            gold: { DEFAULT: '#A3713F', deep: '#8C5F33', soft: '#F9EEDC', cream: '#E8DACB' },
            sand: '#F2EDE4',      // category cards
            paper: '#FCFBF9',     // page background
            ink: { DEFAULT: '#131918', soft: '#4A544E', mute: '#6B746E' },
            line: '#E6E3DC',
          },
          fontFamily: {
            script: ['"Kaushan Script"', 'cursive'],
            serif: ['"Libre Baskerville"', 'Georgia', 'serif'],
            price: ['Montserrat', '"Nunito Sans"', 'system-ui', 'sans-serif'],
            sans: ['"Nunito Sans"', 'system-ui', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-paper text-ink font-sans antialiased pb-[calc(64px+env(safe-area-inset-bottom,0px))] lg:pb-0">
  <a href="#app" class="skip-link">Skip to content</a>

  <!-- Header -->
  <header class="site-header sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-line">
    <div class="mx-auto max-w-[1480px] px-4 lg:px-10 h-[60px] lg:h-[72px] flex items-center gap-4">
      <button class="icon-btn lg:hidden -ml-2" data-menu-open aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <span data-icon="menu" data-icon-class="w-7 h-7"></span>
      </button>

      <a href="#/" class="brand-link flex items-center gap-4 max-lg:absolute max-lg:left-1/2 max-lg:-translate-x-1/2" aria-label="DXN Bundle Store home">
        <img src="assets/img/logo.webp" alt="DXN" class="h-10 lg:h-[52px] w-auto">
        <span class="hidden lg:block h-10 w-px bg-line"></span>
        <span class="hidden lg:block text-[10.5px] leading-[1.35] tracking-[0.14em] text-[#233a6b] font-semibold">ONE WORLD<br>ONE MARKET<br>ONE FAMILY</span>
      </a>

      <nav class="hidden lg:flex items-center gap-7 xl:gap-8 ml-10 xl:ml-16" aria-label="Primary">
        <a href="#/" class="nav-link" data-route="home">Home</a>
        <a href="#/products" class="nav-link" data-route="products">DXN Products</a>
        <a href="#/customize" class="nav-link" data-route="customize">Build Your Bundle</a>
        <a href="#/mystery-box" class="nav-link" data-route="mystery-box">Mystery Box</a>
        <a href="#about" class="nav-link">About DXN</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <form class="hidden lg:flex ml-auto items-center gap-3 h-10 w-[240px] xl:w-[252px] rounded-[10px] bg-[#F1F1EE] px-4 search-field" role="search" data-search>
        <span data-icon="search" data-icon-class="w-5 h-5 text-ink-soft"></span>
        <label for="header-search" class="sr-only">Search DXN products</label>
        <input id="header-search" type="search" placeholder="Search DXN products..." class="bg-transparent w-full text-[13px] placeholder:text-ink-mute focus:outline-none">
      </form>

      <a href="#/review" class="icon-btn relative ml-auto lg:ml-3" aria-label="Bundle, 0 items" data-cart-link>
        <span data-icon="cart" data-icon-class="w-7 h-7"></span>
        <span class="cart-badge" data-cart-count>0</span>
      </a>

      <a href="#/account" data-route="account" class="account-link hidden lg:flex items-center gap-2 ml-3 text-[13px]">
        <span data-icon="user" data-icon-class="w-6 h-6"></span>
        My Account
        <span data-icon="chevronDown" data-icon-class="w-4 h-4"></span>
      </a>
    </div>
  </header>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="mobile-menu lg:hidden" data-menu hidden>
    <div class="mobile-menu__scrim" data-menu-close></div>
    <aside class="mobile-menu__panel" aria-label="Menu">
      <div class="flex items-center justify-between mb-6">
        <img src="assets/img/logo.webp" alt="DXN" class="h-10 w-auto">
        <button class="icon-btn" data-menu-close aria-label="Close menu"><span data-icon="plus" data-icon-class="w-6 h-6 rotate-45"></span></button>
      </div>
      <form class="flex items-center gap-3 h-11 rounded-[10px] bg-[#F1F1EE] px-4 mb-4 search-field" role="search" data-search>
        <span data-icon="search" data-icon-class="w-5 h-5 text-ink-soft"></span>
        <label for="menu-search" class="sr-only">Search DXN products</label>
        <input id="menu-search" type="search" placeholder="Search DXN products..." class="bg-transparent w-full text-sm focus:outline-none">
      </form>
      <nav class="flex flex-col" aria-label="Mobile">
        <a href="#/" class="menu-link" data-route="home">Home</a>
        <a href="#/products" class="menu-link" data-route="products">DXN Products</a>
        <a href="#/customize" class="menu-link" data-route="customize">Build Your Bundle</a>
        <a href="#/mystery-box" class="menu-link" data-route="mystery-box">Mystery Box</a>
        <a href="#about" class="menu-link">About DXN</a>
        <a href="#contact" class="menu-link">Contact</a>
        <a href="#/account" class="menu-link" data-route="account">My Account</a>
      </nav>
    </aside>
  </div>

  <main id="app" tabindex="-1" class="focus:outline-none"></main>

  <!-- Footer (shared) -->
  <footer id="site-footer"></footer>

  <!-- Mobile bottom navigation -->
  <nav class="bottom-nav lg:hidden" aria-label="Quick navigation">
    <a href="#/" class="bottom-nav__item" data-route="home"><span data-icon="home" data-icon-class="w-6 h-6"></span>Home</a>
    <a href="#/products" class="bottom-nav__item" data-route="products"><span data-icon="box" data-icon-class="w-6 h-6"></span>Products</a>
    <a href="#/customize" class="bottom-nav__item" data-route="customize"><span data-icon="sliders" data-icon-class="w-6 h-6"></span>Customize</a>
    <a href="#/mystery-box" class="bottom-nav__item" data-route="mystery-box"><span data-icon="gift" data-icon-class="w-6 h-6"></span>Mystery Box</a>
    <a href="#/account" class="bottom-nav__item" data-route="account"><span data-icon="user" data-icon-class="w-6 h-6"></span>Account</a>
  </nav>

  <!-- Feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
