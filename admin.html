<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin — DXN Bundle Store</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Montserrat:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#1A552E', deep: '#164E2A', band: '#1F4028', soft: '#EBF2E6', mist: '#E2EBD9' },
            gold: { DEFAULT: '#A3713F', deep: '#8C5F33', soft: '#F9EEDC', cream: '#E8DACB' },
            sand: '#F2EDE4',
            paper: '#FCFBF9',
            ink: { DEFAULT: '#131918', soft: '#4A544E', mute: '#6B746E' },
            line: '#E6E3DC',
          },
          fontFamily: {
            serif: ['"Libre Baskerville"', 'Georgia', 'serif'],
            price: ['Montserrat', '"Nunito Sans"', 'system-ui', 'sans-serif'],
            sans: ['"Nunito Sans"', 'system-ui', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-paper text-ink font-sans antialiased">
  <div id="admin" class="min-h-screen"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/admin/app.js"></script>
</body>
</html>
